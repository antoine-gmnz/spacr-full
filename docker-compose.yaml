version: '3.8'

services:
  postgres:
    container_name: postgres_container
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spacr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spacr}
      PGDATA: /data/postgres
    volumes:
       - postgres:/data/postgres
    ports:
      - "8081:5432"
    networks:
      - spacr_network
    restart: unless-stopped
  
  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-spacr@spacr.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-spacr}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
       - pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - spacr_network
    restart: unless-stopped

  redis:
    container_name: redis_container
    image: redis:7-alpine
    command: >
      sh -c '
      if [ -n "$${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}
      else
        redis-server --appendonly yes
      fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spacr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-commander:
    container_name: redis_commander_container
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-}
    ports:
      - "8082:8081"
    networks:
      - spacr_network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

networks:
  spacr_network:
    driver: bridge

volumes:
    postgres:
    pgadmin:
    redis_data: